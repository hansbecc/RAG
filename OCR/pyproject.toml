[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cgr-ocr-characterization"
version = "0.1.0"
description = "Caracterizacion de informes de control mediante PaddleOCR"
requires-python = ">=3.10,<3.13"
dependencies = [
    "PyMuPDF>=1.24,<2",
]

[project.optional-dependencies]
paddle = ["paddleocr>=3.0,<4"]
cpu = ["paddlepaddle>=3.0,<4", "paddleocr>=3.0,<4"]
test = ["pytest>=8,<9"]
easyocr = ["easyocr>=1.7,<2"]
pytesseract = ["pytesseract>=0.3.10,<0.4"]

[project.scripts]
cgr-characterize = "ocr_characterization.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]